<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatal System Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            background-color: black;
            color: red;
            font-size: 24px;
            text-align: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }
        input {
            font-size: 24px;
            padding: 10px;
            border: none;
            background: white;
            color: black;
            text-align: center;
        }
        .glitch {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: red;
            text-shadow: 4px 4px black;
            animation: glitch 0.2s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(-50%, -50%) skew(0deg); }
            25% { transform: translate(-49%, -50%) skew(5deg); }
            50% { transform: translate(-50%, -49%) skew(-5deg); }
            75% { transform: translate(-51%, -50%) skew(3deg); }
            100% { transform: translate(-50%, -51%) skew(-3deg); }
        }
    </style>
</head>
<body>
    <div id="overlay">
        <p class="glitch">SYSTEM FAILURE</p>
        <p class="glitch">ERROR CODE: 0x000DEAD</p>
        <p class="glitch">UNAUTHORIZED ACCESS DETECTED</p>
        <p>الشاشة مجمدة! الطريقة الوحيدة لإلغاء القفل هي كتابة:</p>
        <p><strong>محمد عمي وعمك</strong></p>
        <input type="text" id="unlockInput" placeholder="اكتب هنا...">
    </div>

    <script>
        function goFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        }
        
        document.body.style.overflow = "hidden";
        document.addEventListener("keydown", function(event) {
            event.preventDefault();
        });
        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        goFullscreen();

        document.getElementById("unlockInput").addEventListener("input", function() {
            if (this.value === "محمد عمي وعمك") {
                document.getElementById("overlay").style.display = "none";
                document.body.style.overflow = "auto";
            }
        });
    </script>
</body>
</html>
